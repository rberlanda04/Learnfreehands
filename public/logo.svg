<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Primary Brand Blue Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#004AD7" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Hand Silhouette -->
    <!-- Base palm and 5 extended fingers -->
    <path fill="url(#logoGrad)" filter="url(#blueGlow)" d="
      M 190 450 
      C 120 420 80 370 45 310
      C 25 275 60 250 85 275
      C 105 295 125 315 140 330
      C 130 260 120 180 120 90
      C 120 50 160 50 160 90
      C 165 170 175 240 185 270
      C 195 180 215 110 240 30
      C 250 -5 290 10 280 45
      C 260 120 245 200 240 265
      C 280 180 330 110 375 75
      C 400 55 425 85 400 110
      C 355 155 305 235 285 290
      C 340 285 410 285 460 285
      C 495 285 495 330 460 330
      C 390 330 310 335 270 345
      C 285 390 280 435 245 460
      C 225 475 205 465 190 450 Z" />

    <!-- Precise Vector Hand Path matching original user image precisely -->
    <path fill="url(#logoGrad)" d="
      M 210,448
      C 145,432 112,385 58,308
      C 41,283 67,252 92,275
      L 136,316
      L 136,108
      C 136,65 174,65 174,108
      L 178,255
      L 225,52
      C 238,20 274,32 264,68
      L 236,252
      L 358,85
      C 382,52 414,79 392,106
      L 282,270
      L 448,272
      C 485,272 485,320 448,320
      L 268,325
      C 278,375 272,425 242,450
      C 232,458 220,455 210,448 Z" />

    <!-- Smiley Face (Eyes and Smile) in White -->
    <!-- Left Eye -->
    <rect x="180" y="235" width="16" height="34" rx="8" fill="#FFFFFF" />
    
    <!-- Right Eye -->
    <rect x="245" y="235" width="16" height="34" rx="8" fill="#FFFFFF" />
    
    <!-- Smile Arc -->
    <path d="M 185 328 A 38 38 0 0 0 255 328" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" />
  </g>
</svg>
